<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the map run under the notch and the home indicator;
     the controls are then held clear of both with env(safe-area-inset-*).
     maximum-scale stops iOS zooming the page when a control is double-tapped --
     the map does its own pinch zoom, and a zoomed page cannot be scrolled back. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<!-- Both spellings: the standard one, and Apple's, which is what actually makes
     a home-screen launch open without Safari's chrome. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Geosurvey">
<meta name="theme-color" content="#1a1a18">
<title>Geosurvey — Field Data</title>

<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<style>
  :root {
    --ink:      #1a1a18;
    --ink-soft: #6b6b66;
    --line:     #dcdcd6;
    --surface:  rgba(255,255,255,.94);
    --accent:   #2d6a5a;
    --warn:     #8a2b1c;
    --bar:      calc(env(safe-area-inset-bottom, 0px) + 10px);
    /* The bar's measured height, written by JS. Everything above the bar is
       positioned off this rather than off a guessed constant: the bar grows and
       shrinks with the base-map note -- three lines for Aerial, none for Light
       -- and a fixed offset buried the locate button and the scale bar behind
       it the moment the note appeared. */
    --barh:     64px;
    --above:    calc(var(--bar) + var(--barh) + 8px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    overscroll-behavior: none;           /* no rubber-band or pull-to-refresh over the map */
    -webkit-text-size-adjust: 100%;      /* Safari must not reflow type on rotate */
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: #e9e9e4;
  }
  /* 100dvh, not 100vh: on iOS Safari 100vh is the height with the toolbars
     hidden, so a vh-sized map is taller than the window and its bottom controls
     sit under the browser chrome until you scroll -- which this page cannot do. */
  #map { position: fixed; inset: 0; height: 100dvh; }
  @supports not (height: 100dvh) { #map { height: 100vh; } }

  /* ── controls ──────────────────────────────────────────────────────────── */
  .bar {
    position: fixed; left: 10px; right: 10px; bottom: var(--bar); z-index: 5;
    background: var(--surface); border: 1px solid var(--line); border-radius: 13px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 26px rgba(0,0,0,.14);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: 9px 10px;
    /* Wider than a phone and it stops being a thumb-reachable bar, so it is
       pinned to the left on a tablet or a desktop rather than stretched. */
    max-width: 420px;
  }
  .seg { display: flex; gap: 5px; }
  .seg button {
    flex: 1; font: inherit; font-size: 13.5px; font-weight: 560;
    /* 44px is Apple's minimum touch target, and this is used with gloves on
       in daylight -- not a desktop pointer. */
    min-height: 44px; padding: 0 8px;
    border: 1px solid var(--line); border-radius: 9px;
    background: #fff; color: var(--ink); cursor: pointer;
    touch-action: manipulation;          /* no 300 ms double-tap wait */
  }
  .seg button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .note {
    margin: 7px 2px 1px; font-size: 11.5px; line-height: 1.4; color: var(--ink-soft);
    /* Reserve nothing when empty, so the Light base map does not leave a gap. */
    display: none;
  }
  .note.on { display: block; }
  .note.warn { color: var(--warn); }

  /* The locate button sits above the bar on the right, where a thumb reaches it
     without covering the middle of the map. */
  .locate {
    position: fixed; right: 10px; z-index: 5;
    bottom: calc(var(--above) + 30px);
    width: 48px; height: 48px; padding: 0;
    border: 1px solid var(--line); border-radius: 50%;
    background: var(--surface); color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.14);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    cursor: pointer; touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
  }
  .locate svg { width: 22px; height: 22px; display: block; }
  .locate[data-state="following"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .locate[data-state="locating"]  { color: var(--accent); }
  .locate[data-state="locating"] svg { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  /* Readout: fix quality, which decides whether a reading is worth recording. */
  /* Top-left, not above the bar. The bottom of the screen is the thumb zone and
     belongs to the controls; this is a readout, never touched. It also keeps it
     clear of the scale bar and the attribution, which share the bottom-left. */
  .fix {
    position: fixed; left: 10px; z-index: 5;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.14);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: 6px 9px; font-size: 11.5px; line-height: 1.35;
    font-variant-numeric: tabular-nums; display: none; max-width: 56vw;
  }
  .fix.on { display: block; }
  .fix b { font-weight: 640; }
  .fix .acc-good { color: var(--accent); }
  .fix .acc-poor { color: var(--warn); }

  /* Mapbox's own controls, kept clear of the bar and the safe areas. The
     attribution is required by Mapbox's terms, so it is moved rather than
     hidden. */
  .mapboxgl-ctrl-bottom-left, .mapboxgl-ctrl-bottom-right { bottom: var(--above); }
  .mapboxgl-ctrl-bottom-left { left: calc(env(safe-area-inset-left, 0px) + 2px); }
  .mapboxgl-ctrl-bottom-right { right: calc(env(safe-area-inset-right, 0px) + 2px); }
  .mapboxgl-ctrl-attrib { font-size: 10px; }

  .boot {
    position: fixed; inset: 0; z-index: 9; display: flex;
    align-items: center; justify-content: center; padding: 24px;
    background: #e9e9e4; text-align: center; color: var(--ink-soft); font-size: 13px;
  }
  .boot[hidden] { display: none; }
  .boot .msg { max-width: 320px; }
  .boot code { font-size: 12px; background: #fff; border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 5px; }
</style>
</head>
<body>

<div id="map"></div>

<div class="boot" id="boot"><div class="msg">Loading the map…</div></div>

<div class="fix" id="fix" aria-live="polite"></div>

<button class="locate" id="locate" type="button" data-state="off"
        aria-label="Show my location" title="Show my location">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="3.2"></circle>
    <path d="M12 2v3.2M12 18.8V22M2 12h3.2M18.8 12H22"></path>
    <circle cx="12" cy="12" r="8"></circle>
  </svg>
</button>

<div class="bar">
  <div class="seg" role="group" aria-label="Base map">
    <button id="b-light" type="button" aria-pressed="false">Light</button>
    <button id="b-sat"   type="button" aria-pressed="false">Satellite</button>
    <button id="b-naip"  type="button" aria-pressed="true">Aerial</button>
  </div>
  <div class="note" id="base-note"></div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<script>
/* ===========================================================================
   Geosurvey — field data collection
   ---------------------------------------------------------------------------
   A map for recording observations in the field from a phone. This first cut is
   the base: the three base maps the desktop GIS uses, and a GPS fix good enough
   to decide whether a reading is worth keeping. Data capture comes next.

   The token is base64'd for the same reason it is on the other sites: it keeps
   a plain `pk.` string out of the file, so a casual scrape of the HTML does not
   hand it over. It is not a secret -- a public token never is -- and the real
   protection is the URL restriction on the token itself, which is why a new
   origin has to be added to it before this page will draw. See README.md.
   =========================================================================== */
mapboxgl.accessToken = atob(
  'cGsuZXlKMUlqb2lhbVJsZG05NUlpd2lZU0k2SW1OdGN6bGljVE0xZURCamRHWXpNRzlsYkhZMmVub3hPRFFpZlEuWTBrbWgxTzNWbVpuV2tQX0lMaWJuQQ==');

var BOOT = document.getElementById('boot');
function bootFail(html) { BOOT.hidden = false; BOOT.querySelector('.msg').innerHTML = html; }

if (!mapboxgl.supported()) {
  bootFail('This browser cannot draw the map — it needs WebGL.<br><br>' +
           'On an iPhone, Safari or Chrome on iOS 15 or later will work.');
  throw new Error('WebGL unsupported');
}

/* ── what the session remembers ──────────────────────────────────────────────
   Only the camera and the chosen base map. Kept deliberately small and
   versioned, so a later change to the shape can ignore an older entry rather
   than trip over it. */
var STORE = 'geosurvey.v1';
var SAVED = (function () {
  try {
    var o = JSON.parse(localStorage.getItem(STORE) || 'null');
    return (o && o.v === 1) ? o : null;
  } catch (e) { return null; }
})();
function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({
      v: 1, base: baseMap,
      view: { c: map.getCenter().toArray(), z: map.getZoom() }
    }));
  } catch (e) { /* private browsing, or the quota is full; not worth reporting */ }
}

var map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/light-v11',
  center: (SAVED && SAVED.view && SAVED.view.c) || [-119.6, 36.6],
  zoom: (SAVED && SAVED.view && typeof SAVED.view.z === 'number') ? SAVED.view.z : 5.1,
  // z20 for the same reason the desktop map allows it: NAIP's 0.3 m pixels run
  // out around z19, so z20 is where imagery is being enlarged rather than
  // revealed -- useful for placing a point precisely, not for seeing more.
  maxZoom: 20,
  // Pitch and rotate are off. In the field a tilted or turned map makes a
  // recorded position harder to read against the ground, and a stray two-finger
  // twist while panning is easy to do and not obvious to undo.
  pitchWithRotate: false,
  dragRotate: false,
  touchPitch: false,
  attributionControl: false
});
map.touchZoomRotate.disableRotation();

// Both bottom-left, stacked. The attribution defaulted to bottom-right, where
// its button sat underneath the locate button -- so the right-hand side is left
// to the one control a thumb actually reaches for.
map.addControl(new mapboxgl.ScaleControl({ maxWidth: 110, unit: 'imperial' }), 'bottom-left');
map.addControl(new mapboxgl.AttributionControl({ compact: true }), 'bottom-left');

/* ── base maps ───────────────────────────────────────────────────────────────
   Three, switched by toggling raster layers rather than by setStyle. setStyle
   tears the style down and rebuilds it, which would drop every source and layer
   added here -- including, once capture exists, the points being collected. */
var baseMap = (SAVED && SAVED.base) || 'naip';

var BASE_NOTE = {
  light: '',
  sat: 'Mapbox Satellite — a blend of satellite and aerial sources, worldwide, ' +
       'with mixed capture dates.',
  // Kept short deliberately: on a phone this sits over the map, and the long
  // version ran to three lines.
  naip: 'USDA NAIP / USGS, about 0.3 m, from zoom 12 up. Rendered on demand — ' +
        'a tile can take several seconds. US only.'
};

function addBaseLayers() {
  // Under the first symbol layer, so the style's own place names and roads stay
  // legible on top of imagery instead of being buried by it.
  var firstSymbol;
  var ls = map.getStyle().layers || [];
  for (var i = 0; i < ls.length; i++) {
    if (ls[i].type === 'symbol') { firstSymbol = ls[i].id; break; }
  }

  if (!map.getSource('satellite')) {
    map.addSource('satellite', { type: 'raster', url: 'mapbox://mapbox.satellite', tileSize: 256 });
  }
  if (!map.getLayer('sat')) {
    map.addLayer({
      id: 'sat', type: 'raster', source: 'satellite',
      layout: { visibility: 'none' }, paint: { 'raster-opacity': 1 }
    }, firstSymbol);
  }

  if (!map.getSource('naip')) {
    map.addSource('naip', {
      type: 'raster',
      tiles: ['https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPPlus/' +
              'ImageServer/exportImage?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857' +
              '&size=256,256&format=jpgpng&transparent=false&f=image'],
      tileSize: 256,
      attribution: 'Imagery: USGS / USDA NAIP'
    });
  }
  if (!map.getLayer('naip')) {
    map.addLayer({
      id: 'naip', type: 'raster', source: 'naip',
      // From z12 only. Each tile is rendered on request and the cost grows with
      // the area asked for: a neighbourhood tile returns in about a second, a
      // statewide one in tens of seconds. Below z12 satellite carries the base,
      // which is also the honest choice -- 0.3 m imagery downsampled to a
      // statewide view shows nothing Mapbox Satellite does not.
      minzoom: 12,
      layout: { visibility: 'none' }, paint: { 'raster-opacity': 1 }
    }, firstSymbol);
  }
}

function applyBase() {
  if (map.getLayer('naip')) {
    map.setLayoutProperty('naip', 'visibility', baseMap === 'naip' ? 'visible' : 'none');
  }
  if (map.getLayer('sat')) {
    // Satellite stays on underneath Aerial: it is the base below z12, and the
    // backdrop above it, so there is never a blank frame while a NAIP tile is
    // still rendering.
    map.setLayoutProperty('sat', 'visibility',
      (baseMap === 'sat' || baseMap === 'naip') ? 'visible' : 'none');
  }
}

/* Publish the bar's height so the controls above it can sit clear of it. A
   ResizeObserver rather than a measurement at load: the bar changes height when
   the note changes, when the phone is rotated, and when the text reflows at a
   different width. */
var BAR_EL = document.querySelector('.bar');
function measureBar() {
  document.documentElement.style.setProperty('--barh', BAR_EL.offsetHeight + 'px');
}
if (window.ResizeObserver) new ResizeObserver(measureBar).observe(BAR_EL);
else window.addEventListener('resize', measureBar);
measureBar();

var BASE_BTN = { light: 'b-light', sat: 'b-sat', naip: 'b-naip' };
function setBase(mode) {
  baseMap = BASE_BTN[mode] ? mode : 'light';
  Object.keys(BASE_BTN).forEach(function (k) {
    var b = document.getElementById(BASE_BTN[k]);
    if (b) b.setAttribute('aria-pressed', String(k === baseMap));
  });
  var note = document.getElementById('base-note');
  var txt = BASE_NOTE[baseMap] || '';
  note.textContent = txt;
  note.className = 'note' + (txt ? ' on' : '');
  applyBase();
  save();
}
Object.keys(BASE_BTN).forEach(function (k) {
  document.getElementById(BASE_BTN[k]).addEventListener('click', function () { setBase(k); });
});

/* ── where I am ──────────────────────────────────────────────────────────────
   Not Mapbox's GeolocateControl. This needs the accuracy figure on screen as a
   number -- in the field the question is "is this fix good enough to record?",
   and a blue dot alone cannot answer it. */
var GEO = {
  watch: null,
  following: false,
  last: null
};

function geoLayers() {
  if (!map.getSource('me')) {
    map.addSource('me', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  }
  // The accuracy disc is a real circle on the ground, so its radius is in
  // metres and has to be recomputed per zoom. circle-radius is in screen
  // pixels, so the conversion is the Mercator metres-per-pixel at this
  // latitude -- otherwise the disc would claim a different accuracy at every
  // zoom level, which is worse than not drawing it.
  if (!map.getLayer('me-acc')) {
    map.addLayer({
      id: 'me-acc', type: 'circle', source: 'me',
      filter: ['==', ['geometry-type'], 'Point'],
      paint: {
        'circle-radius': ['max', 4, ['/', ['get', 'acc'], ['get', 'mpp']]],
        'circle-color': '#2d6a5a', 'circle-opacity': 0.14,
        'circle-stroke-color': '#2d6a5a', 'circle-stroke-width': 1,
        'circle-stroke-opacity': 0.4, 'circle-pitch-alignment': 'map'
      }
    });
  }
  if (!map.getLayer('me-dot')) {
    map.addLayer({
      id: 'me-dot', type: 'circle', source: 'me',
      filter: ['==', ['geometry-type'], 'Point'],
      paint: {
        'circle-radius': 6.5, 'circle-color': '#2d6a5a',
        'circle-stroke-color': '#ffffff', 'circle-stroke-width': 2.5
      }
    });
  }
}

function metresPerPixel(lat, zoom) {
  return 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom);
}

function drawMe() {
  var p = GEO.last;
  if (!p || !map.getSource('me')) return;
  map.getSource('me').setData({
    type: 'FeatureCollection',
    features: [{
      type: 'Feature',
      properties: { acc: p.acc, mpp: metresPerPixel(p.lat, map.getZoom()) },
      geometry: { type: 'Point', coordinates: [p.lon, p.lat] }
    }]
  });
}
// The disc is sized in pixels, so it has to be rebuilt as the zoom changes.
map.on('zoom', drawMe);

function showFix() {
  var el = document.getElementById('fix');
  var p = GEO.last;
  if (!p) { el.className = 'fix'; return; }
  var m = p.acc;
  var cls = m <= 10 ? 'acc-good' : m >= 30 ? 'acc-poor' : '';
  var acc = m < 10 ? m.toFixed(1) : Math.round(m);
  el.innerHTML =
    '<b>' + p.lat.toFixed(6) + '</b>, <b>' + p.lon.toFixed(6) + '</b><br>' +
    '±<span class="' + cls + '">' + acc + ' m</span>' +
    (p.alt != null ? ' · ' + Math.round(p.alt * 3.28084) + ' ft' : '');
  el.className = 'fix on';
}

function setLocState(s) { document.getElementById('locate').setAttribute('data-state', s); }

function startWatch() {
  if (!navigator.geolocation) {
    alert('This browser has no location service.');
    return;
  }
  // A secure context is required for geolocation. Served over plain http from
  // anything but localhost, the call fails with a permission error that reads
  // as the user having denied it -- so it is named here instead of guessed at.
  if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    alert('Location needs a secure connection.\n\n' +
          'Open this page over https, or over http://localhost while developing.');
    return;
  }
  setLocState('locating');
  GEO.watch = navigator.geolocation.watchPosition(function (pos) {
    GEO.last = {
      lat: pos.coords.latitude, lon: pos.coords.longitude,
      acc: pos.coords.accuracy,
      alt: (typeof pos.coords.altitude === 'number') ? pos.coords.altitude : null
    };
    geoLayers();
    drawMe();
    showFix();
    if (GEO.following) {
      setLocState('following');
      map.easeTo({
        center: [GEO.last.lon, GEO.last.lat],
        zoom: Math.max(map.getZoom(), 17),
        duration: 700
      });
    } else {
      setLocState('on');
    }
  }, function (err) {
    setLocState('off');
    GEO.following = false;
    var msg = err.code === 1
      ? 'Location is blocked for this site.\n\nOn iPhone: Settings → Safari → Location, ' +
        'or the "aA" menu in the address bar → Website Settings.'
      : err.code === 3 ? 'Location timed out. Under tree cover or indoors this can take a while.'
      : 'Location is unavailable right now.';
    alert(msg);
  }, {
    // The whole point is field accuracy, so the GPS radio is worth the battery.
    enableHighAccuracy: true,
    timeout: 20000,
    // No cached fix: a position from ten minutes ago is worse than none, because
    // it looks exactly like a current one.
    maximumAge: 0
  });
}

document.getElementById('locate').addEventListener('click', function () {
  if (GEO.watch == null) {
    GEO.following = true;
    startWatch();
    return;
  }
  // Already watching: the button toggles whether the map chases the fix. The
  // watch itself stays on, so the dot keeps up to date while the map is panned
  // somewhere else by hand.
  GEO.following = !GEO.following;
  setLocState(GEO.following ? 'following' : 'on');
  if (GEO.following && GEO.last) {
    map.easeTo({ center: [GEO.last.lon, GEO.last.lat], zoom: Math.max(map.getZoom(), 17), duration: 700 });
  }
});

// Panning by hand means "stop chasing me" -- otherwise the next fix yanks the
// map back and the gesture looks broken.
map.on('dragstart', function () {
  if (GEO.following) { GEO.following = false; setLocState('on'); }
});

/* ── start ──────────────────────────────────────────────────────────────── */
map.on('load', function () {
  addBaseLayers();
  setBase(baseMap);
  BOOT.hidden = true;
});

map.on('moveend', save);

map.on('error', function (e) {
  var msg = (e && e.error && e.error.message) || '';
  // A 401 or 403 on the style means the token is refusing this origin, which is
  // the one failure a new deployment hits every time. Everything else -- a NAIP
  // tile timing out, say -- is transient and must not replace the whole map
  // with an error screen.
  if (/401|403|Unauthorized|Forbidden/i.test(msg) && !map.isStyleLoaded()) {
    bootFail('Mapbox refused this address.<br><br>' +
             'The access token is restricted to a list of URLs, and <code>' +
             location.origin + '</code> is not on it.<br><br>' +
             'Add it at account.mapbox.com → Tokens → URL restrictions. ' +
             'See README.md.');
  }
});
</script>
</body>
</html>
